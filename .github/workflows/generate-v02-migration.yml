name: generate-v02-migration

on:
  push:
    branches:
      - agent/v0.2-packaging-aggregation

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Generate EF Core migration
        run: >-
          docker run --rm
          -v "${{ github.workspace }}:/work"
          -w /work
          mcr.microsoft.com/dotnet/sdk:10.0
          sh -lc "dotnet tool restore && dotnet tool run dotnet-ef migrations add AddPackagingAggregation --project src/UnitAtlas.Infrastructure --startup-project src/UnitAtlas.Infrastructure --output-dir Persistence/Migrations"
      - name: Commit generated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/UnitAtlas.Infrastructure/Persistence/Migrations
          if git diff --cached --quiet; then
            echo "No migration changes generated"
            exit 0
          fi
          git commit -m "chore: generate packaging aggregation migration"
          git push
