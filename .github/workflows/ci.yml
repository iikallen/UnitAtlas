name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build images
        run: docker compose build
      - name: Start isolated stack
        run: docker compose up -d --wait
      - name: Verify forced RLS boundary
        run: |
          docker compose exec -T db psql -U unitatlas_admin -d unitatlas -tAc "SELECT NOT usesuper FROM pg_user WHERE usename='unitatlas'" | grep -qx t
          docker compose exec -T -e PGPASSWORD=unitatlas_dev db psql -h 127.0.0.1 -U unitatlas -d unitatlas -tAc "SELECT count(*) FROM products" | grep -qx 0
          docker compose exec -T db psql -U unitatlas_admin -d unitatlas -tAc "SELECT count(*)=15 AND bool_and(relrowsecurity AND relforcerowsecurity) FROM pg_class WHERE relname IN ('products','units','trace_events','unit_states','tenant_memberships','audit_entries','external_references','idempotency_records','locations','lots','outbox_messages','product_identifiers','public_passport_configs','sites','unit_identifiers')" | grep -qx t
      - name: Run .NET tests
        run: >-
          docker run --rm
          --add-host=host.docker.internal:host-gateway
          -e UNITATLAS_TEST_URL=http://host.docker.internal:8080
          -v "${{ github.workspace }}:/work"
          -w /work
          mcr.microsoft.com/dotnet/sdk:10.0
          dotnet test UnitAtlas.slnx --configuration Release
      - name: Smoke test web
        run: curl --fail --silent http://localhost:3000 >/dev/null
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop stack
        if: always()
        run: docker compose down -v
