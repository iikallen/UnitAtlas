name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Frontend typecheck and lint
        run: >-
          docker run --rm
          -v "${{ github.workspace }}/src/unitatlas-web:/app"
          -w /app node:24-alpine
          sh -lc "npm ci && npm run typecheck && npm run lint"
      - name: Build images
        run: docker compose build
      - name: Start isolated stack
        run: docker compose up -d --wait
      - name: Verify forced RLS boundary
        run: |
          docker compose exec -T db psql -U unitatlas_admin -d unitatlas -tAc "SELECT NOT usesuper FROM pg_user WHERE usename='unitatlas'" | grep -qx t
          docker compose exec -T -e PGPASSWORD=unitatlas_dev db psql -h 127.0.0.1 -U unitatlas -d unitatlas -tAc "SELECT count(*) FROM products" | grep -qx 0
          docker compose exec -T db psql -U unitatlas_admin -d unitatlas -tAc "SELECT count(*)=17 AND bool_and(relrowsecurity AND relforcerowsecurity) FROM pg_class WHERE relname IN ('products','units','trace_events','unit_states','tenant_memberships','audit_entries','external_references','idempotency_records','locations','lots','outbox_messages','product_identifiers','sites','unit_identifiers','logistic_units','logistic_unit_contents','aggregation_events')" | grep -qx t
          docker compose exec -T db psql -U unitatlas_admin -d unitatlas -tAc "SELECT NOT relrowsecurity AND NOT relforcerowsecurity FROM pg_class WHERE relname='public_passport_configs'" | grep -qx t
          docker compose exec -T db psql -U unitatlas_admin -d unitatlas -tAc "SELECT count(*)=6 AND bool_and(cmd IN ('SELECT','INSERT')) FROM pg_policies WHERE tablename IN ('trace_events','audit_entries','aggregation_events')" | grep -qx t
          if docker compose exec -T db psql -v ON_ERROR_STOP=1 -U unitatlas_admin -d unitatlas -c 'UPDATE trace_events SET "Actor" = "Actor" WHERE false'; then exit 1; fi
          if docker compose exec -T db psql -v ON_ERROR_STOP=1 -U unitatlas_admin -d unitatlas -c 'DELETE FROM audit_entries WHERE false'; then exit 1; fi
          if docker compose exec -T db psql -v ON_ERROR_STOP=1 -U unitatlas_admin -d unitatlas -c 'UPDATE aggregation_events SET "Action" = "Action" WHERE false'; then exit 1; fi
      - name: Build and run .NET tests
        run: >-
          docker run --rm
          --add-host=host.docker.internal:host-gateway
          -e UNITATLAS_TEST_URL=http://host.docker.internal:8080
          -v "${{ github.workspace }}:/work"
          -w /work
          mcr.microsoft.com/dotnet/sdk:10.0
          sh -lc "dotnet build UnitAtlas.slnx --configuration Release && dotnet test UnitAtlas.slnx --configuration Release --no-build"
      - name: Smoke test web
        run: |
          curl --fail --silent http://localhost:3000 >/dev/null
          curl --fail --silent http://localhost:3000/bff/dashboard >/dev/null
          curl --fail --silent --dump-header - --output /dev/null 'http://localhost:3000/bff/units?limit=2' | grep -qi 'x-next-cursor:'
          curl --fail --silent http://localhost:8080/api/v1/sites >/dev/null
          curl --fail --silent http://localhost:8080/api/v1/locations >/dev/null
          curl --fail --silent http://localhost:8080/api/v1/units/UA-KZ-2026-0000058219/events >/dev/null
          curl --fail --silent http://localhost:8080/api/v1/passports/UA-KZ-2026-0000058219 >/dev/null
          curl --fail --silent http://localhost:3000/p/demo-x200-58219 | grep -q "ПУБЛИЧНЫЙ ЦИФРОВОЙ ПАСПОРТ"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8080/api/dashboard)" = "404"
          public_json="$(curl --fail --silent http://localhost:8080/api/public/passports/demo-x200-58219)"
          if echo "$public_json" | grep -Eqi 'actor|location|demo.operator'; then exit 1; fi
          curl --fail --silent --dump-header - --output /dev/null http://localhost:8080/api/public/passports/demo-x200-58219 | grep -qi 'x-content-type-options: nosniff'
          missing_json="$(curl --silent http://localhost:8080/api/v1/units/does-not-exist)"
          echo "$missing_json" | grep -q '"code":"UNIT_NOT_FOUND"'
          echo "$missing_json" | grep -q '"traceId"'
          for _ in $(seq 1 20); do test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:3000/auth/login)" = "307"; done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:3000/auth/login)" = "429"
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop stack
        if: always()
        run: docker compose down -v
