services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-unitatlas}
      POSTGRES_USER: ${POSTGRES_USER:-unitatlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-unitatlas_dev}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-unitatlas} -d ${POSTGRES_DB:-unitatlas}"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - unitatlas-data:/var/lib/postgresql

  api:
    build: src/UnitAtlas.Api
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB:-unitatlas};Username=${POSTGRES_USER:-unitatlas};Password=${POSTGRES_PASSWORD:-unitatlas_dev}
      Cors__Origin: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  web:
    build:
      context: src/unitatlas-web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080/api
    environment:
      API_INTERNAL_URL: http://api:8080/api
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  unitatlas-data:
