services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-unitatlas}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-unitatlas_admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-unitatlas_admin_dev}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER:-unitatlas_admin} -d ${POSTGRES_DB:-unitatlas}"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - unitatlas-data:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-unitatlas-app-role.sql:ro

  api:
    build:
      context: .
      dockerfile: src/UnitAtlas.Api/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB:-unitatlas};Username=unitatlas;Password=unitatlas_dev
      Cors__Origin: http://localhost:3000
      Authentication__DemoMode: "true"
      Authentication__DemoTenantId: 11111111-1111-1111-1111-111111111111
      Database__ApplyMigrations: "true"
      Demo__SeedData: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/ready"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build:
      context: src/unitatlas-web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080/api
    environment:
      API_INTERNAL_URL: http://api:8080/api
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  unitatlas-data:
